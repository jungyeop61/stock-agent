# Explicit overlay for staged Toss Securities LIVE wiring.
# The base compose file remains permanently fail-closed. Use this overlay only
# together with deploy/.live.env after reviewing deploy/README.md.
services:
  spring:
    environment:
      JUSIKA_BROKER_MODE: live
      JUSIKA_LIVE_TRADING_ENABLED: ${JUSIKA_LIVE_TRADING_ENABLED:-false}
      JUSIKA_TRADING_KILL_SWITCH_ACTIVE: ${JUSIKA_TRADING_KILL_SWITCH_ACTIVE:-true}
      JUSIKA_LIVE_ALLOWED_ACCOUNT_SEQS: ${JUSIKA_LIVE_ALLOWED_ACCOUNT_SEQS:-}
      JUSIKA_LIVE_ALLOWED_INSTRUMENTS: ${JUSIKA_LIVE_ALLOWED_INSTRUMENTS:-}
      JUSIKA_LIVE_MAX_ORDER_QUANTITY: ${JUSIKA_LIVE_MAX_ORDER_QUANTITY:-0}
      JUSIKA_LIVE_MAX_KRW_ORDER_AMOUNT: ${JUSIKA_LIVE_MAX_KRW_ORDER_AMOUNT:-0}
      JUSIKA_LIVE_MAX_USD_ORDER_AMOUNT: ${JUSIKA_LIVE_MAX_USD_ORDER_AMOUNT:-0}
      JUSIKA_LIVE_MAX_DAILY_ORDER_QUANTITY: ${JUSIKA_LIVE_MAX_DAILY_ORDER_QUANTITY:-0}
      JUSIKA_LIVE_MAX_DAILY_KRW_ORDER_AMOUNT: ${JUSIKA_LIVE_MAX_DAILY_KRW_ORDER_AMOUNT:-0}
      JUSIKA_LIVE_MAX_DAILY_USD_ORDER_AMOUNT: ${JUSIKA_LIVE_MAX_DAILY_USD_ORDER_AMOUNT:-0}
      JUSIKA_LIVE_MAX_OPEN_ORDERS_PER_ACCOUNT: ${JUSIKA_LIVE_MAX_OPEN_ORDERS_PER_ACCOUNT:-0}
      JUSIKA_LIVE_MAX_OPEN_ORDERS_PER_INSTRUMENT: ${JUSIKA_LIVE_MAX_OPEN_ORDERS_PER_INSTRUMENT:-0}
      JUSIKA_LIVE_MAX_MUTATIONS_PER_ACCOUNT_PER_MINUTE: ${JUSIKA_LIVE_MAX_MUTATIONS_PER_ACCOUNT_PER_MINUTE:-0}
      JUSIKA_LIVE_MAX_MUTATIONS_PER_INSTRUMENT_PER_MINUTE: ${JUSIKA_LIVE_MAX_MUTATIONS_PER_INSTRUMENT_PER_MINUTE:-0}
      JUSIKA_LIVE_QUANTITY_ORDER_SUBMISSION_CONNECTED: ${JUSIKA_LIVE_QUANTITY_ORDER_SUBMISSION_CONNECTED:-false}
      JUSIKA_LIVE_AMOUNT_ORDER_SUBMISSION_CONNECTED: ${JUSIKA_LIVE_AMOUNT_ORDER_SUBMISSION_CONNECTED:-false}
      JUSIKA_LIVE_NORMAL_ORDER_CANCELLATION_CONNECTED: ${JUSIKA_LIVE_NORMAL_ORDER_CANCELLATION_CONNECTED:-false}
      JUSIKA_LIVE_NORMAL_ORDER_MODIFICATION_CONNECTED: ${JUSIKA_LIVE_NORMAL_ORDER_MODIFICATION_CONNECTED:-false}
      JUSIKA_LIVE_SINGLE_CONDITIONAL_ORDER_CREATION_CONNECTED: ${JUSIKA_LIVE_SINGLE_CONDITIONAL_ORDER_CREATION_CONNECTED:-false}
      JUSIKA_LIVE_OCO_CONDITIONAL_ORDER_CREATION_CONNECTED: ${JUSIKA_LIVE_OCO_CONDITIONAL_ORDER_CREATION_CONNECTED:-false}
      JUSIKA_LIVE_OTO_CONDITIONAL_ORDER_CREATION_CONNECTED: ${JUSIKA_LIVE_OTO_CONDITIONAL_ORDER_CREATION_CONNECTED:-false}
      JUSIKA_LIVE_CONDITIONAL_ORDER_CANCELLATION_CONNECTED: ${JUSIKA_LIVE_CONDITIONAL_ORDER_CANCELLATION_CONNECTED:-false}
      JUSIKA_LIVE_CONDITIONAL_ORDER_MODIFICATION_CONNECTED: ${JUSIKA_LIVE_CONDITIONAL_ORDER_MODIFICATION_CONNECTED:-false}
