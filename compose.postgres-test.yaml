name: stock-agent-postgres-test

services:
  postgres-integration-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jusika_integration_test
      POSTGRES_USER: jusika_test
      POSTGRES_PASSWORD: ${JUSIKA_TEST_POSTGRES_PASSWORD:?JUSIKA_TEST_POSTGRES_PASSWORD 값을 설정해야 합니다}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${JUSIKA_TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jusika_test -d jusika_integration_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
