spring:
  application:
    name: jusika-spring-backend
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:h2:mem:jusika;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

server:
  port: ${SPRING_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jusika:
  internal-api:
    read-key: ${JUSIKA_INTERNAL_READ_API_KEY:}
    order-key: ${JUSIKA_INTERNAL_ORDER_API_KEY:}
  order-preview:
    expiration: ${ORDER_PREVIEW_EXPIRATION:2m}
  broker:
    mode: ${JUSIKA_BROKER_MODE:mock}
    live-enabled: ${JUSIKA_LIVE_TRADING_ENABLED:false}
    kill-switch-active: ${JUSIKA_TRADING_KILL_SWITCH_ACTIVE:true}
    allowed-account-seqs: ${JUSIKA_LIVE_ALLOWED_ACCOUNT_SEQS:}
    live-order-limits:
      max-quantity: ${JUSIKA_LIVE_MAX_ORDER_QUANTITY:0}
      max-krw-order-amount: ${JUSIKA_LIVE_MAX_KRW_ORDER_AMOUNT:0}
      max-usd-order-amount: ${JUSIKA_LIVE_MAX_USD_ORDER_AMOUNT:0}
    live-daily-order-limits:
      max-quantity: ${JUSIKA_LIVE_MAX_DAILY_ORDER_QUANTITY:0}
      max-krw-order-amount: ${JUSIKA_LIVE_MAX_DAILY_KRW_ORDER_AMOUNT:0}
      max-usd-order-amount: ${JUSIKA_LIVE_MAX_DAILY_USD_ORDER_AMOUNT:0}
    live-adapters:
      quantity-order-submission: ${JUSIKA_LIVE_QUANTITY_ORDER_SUBMISSION_CONNECTED:false}
      amount-order-submission: ${JUSIKA_LIVE_AMOUNT_ORDER_SUBMISSION_CONNECTED:false}
      normal-order-cancellation: ${JUSIKA_LIVE_NORMAL_ORDER_CANCELLATION_CONNECTED:false}
      normal-order-modification: ${JUSIKA_LIVE_NORMAL_ORDER_MODIFICATION_CONNECTED:false}
      single-conditional-order-creation: ${JUSIKA_LIVE_SINGLE_CONDITIONAL_ORDER_CREATION_CONNECTED:false}
      oco-conditional-order-creation: ${JUSIKA_LIVE_OCO_CONDITIONAL_ORDER_CREATION_CONNECTED:false}
      oto-conditional-order-creation: ${JUSIKA_LIVE_OTO_CONDITIONAL_ORDER_CREATION_CONNECTED:false}
      conditional-order-cancellation: ${JUSIKA_LIVE_CONDITIONAL_ORDER_CANCELLATION_CONNECTED:false}
      conditional-order-modification: ${JUSIKA_LIVE_CONDITIONAL_ORDER_MODIFICATION_CONNECTED:false}
  toss:
    base-url: ${TOSSINVEST_BASE_URL:https://openapi.tossinvest.com}
    client-id: ${TOSSINVEST_CLIENT_ID:}
    client-secret: ${TOSSINVEST_CLIENT_SECRET:}
    connect-timeout: 3s
    read-timeout: 5s
